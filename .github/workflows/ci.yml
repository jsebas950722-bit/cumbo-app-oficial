name: Verificar build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Deno (para verificar las Edge Functions)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas automatizadas
        run: npm run test

      - name: Verificar tipos de las Edge Functions (Deno)
        run: npm run check:functions

      - name: Compilar (con variables de entorno de ejemplo)
        run: cp .env.example .env && npm run build
